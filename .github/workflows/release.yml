---
name: "Auto Release"

# Keyed on a successful "Test & Lint" run on olen, so a release can only be cut
# from a commit that linted, tested and built.
on:
  workflow_run:
    workflows: ["Test & Lint"]
    types: [completed]
    branches: [olen]

permissions:
  contents: write

jobs:
  release:
    name: "Create Release"
    runs-on: "ubuntu-latest"
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: "✏️ Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A SHA from this repository's own workflow run
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: "📋 Did package.json change?"
        id: check_package
        run: |
          BEFORE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -z "$BEFORE_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git diff --name-only "$BEFORE_SHA" HEAD -- package.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "🏷️ Read the version"
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        if: steps.check_package.outputs.changed == 'true'

      - name: "🏷️ Does the tag exist already?"
        uses: mukunku/tag-exists-action@v1.7.0
        id: check_tag
        with:
          tag: "v${{ steps.version.outputs.version }}"
        if: steps.check_package.outputs.changed == 'true'

      - name: "⏭️ Nothing to release"
        run: echo "package.json unchanged, or the tag exists already"
        if: steps.check_package.outputs.changed != 'true' || steps.check_tag.outputs.exists == 'true'

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      - name: "📥 Install dependencies"
        run: npm ci
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      # "dist" is gitignored: the bundle is built here & attached to the
      # release, which is where HACS reads it from. Nothing built is committed.
      - name: "🔨 Build"
        run: npm run build
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      # GitHub's own release notes list merged PRs, and this branch is committed
      # to directly - they come out empty. Build them from the commits instead,
      # which are conventional ("feat:", "fix:", ...).
      - name: "📝 Build the release notes"
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          emit() {
            OUT=$(git log --no-merges --format='%s' $RANGE \
              | grep -E "^($2)(\(.+\))?!?: " \
              | sed -E "s/^($2)(\(.+\))?!?: //" \
              | sed 's/^./\U&/' | sed 's/^/- /')
            [ -n "$OUT" ] && printf '### %s\n\n%s\n\n' "$1" "$OUT"
            return 0
          }
          # One heading for all of them, and drop commit trailers & blank lines
          BREAKING=$(git log --no-merges --format='%H%x09%s' $RANGE \
            | while IFS="$(printf '\t')" read -r SHA SUBJECT; do
              BODY=$(git log -1 --format='%b' "$SHA")
              case "$BODY" in
                *"BREAKING CHANGE:"*)
                  printf -- '- **%s**\n' "${SUBJECT#*: }"
                  echo "$BODY" | awk '/^BREAKING CHANGE:/{f=1} f' \
                    | grep -vE '^[A-Za-z-]+-[Bb]y: ' \
                    | grep -v '^[[:space:]]*$' \
                    | sed 's/^BREAKING CHANGE: //' | sed 's/^/  /'
                  ;;
              esac
            done)
          {
            [ -n "$BREAKING" ] && printf '### ⚠️ Breaking changes\n\n%s\n\n' "$BREAKING"
            emit "Features" "feat"
            emit "Fixes" "fix"
            emit "Performance" "perf"
            emit "Documentation" "docs"
            emit "Internal" "test|ci|chore|refactor|style|build"
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...v$VERSION"
            fi
          } > release-notes.md
          cat release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      - name: "🏷️ Create the tag"
        uses: rickstaa/action-create-tag@v1
        with:
          tag: "v${{ steps.version.outputs.version }}"
          tag_exists_error: false
          message: "Version ${{ steps.version.outputs.version }}"
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      # A version containing "beta" is published as a prerelease, which HACS
      # only offers to users who opted into betas.
      - name: "🚀 Publish the release"
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') }}
          body_path: release-notes.md
          name: "Version ${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: dist/mini-graph-card-bundle.js
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'
