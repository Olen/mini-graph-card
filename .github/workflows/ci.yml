---
name: "Test & Lint"

on:
  # PRs to olen are tested via pull_request; push runs only on olen, which the
  # Auto Release workflow keys on.
  push:
    branches:
      - olen
  pull_request:
    branches:
      - olen

# Least-privilege: this workflow only checks out, tests and builds.
permissions:
  contents: read

jobs:
  test:
    name: "Test & Lint"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: "Install dependencies"
        run: npm ci

      # "build" runs the linter itself, but running it separately reports a
      # lint failure as a lint failure rather than as a failed build.
      - name: "Run linter"
        run: npm run lint

      - name: "Run tests"
        run: npm run test

      - name: "Build"
        run: npm run build

      - name: "Archive the bundle"
        uses: actions/upload-artifact@v4
        with:
          name: mini-graph-card-bundle
          path: dist/mini-graph-card-bundle.js
